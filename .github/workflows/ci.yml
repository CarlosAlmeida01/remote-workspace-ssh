name: Verify extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
      - run: npm run update:dts
      - run: npm run lint:release
      - run: npm run test:release
      - run: npm run test:local
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/release.cjs check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: extension-vsix
          path: remote-workspace-ssh-*.vsix
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
      - name: Publish to Open VSX
        run: node scripts/release.cjs publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const bytes = fs.readFileSync(`${manifest.name}-${manifest.version}.vsix`);
            const { publishGitHubRelease } = require('./scripts/github-release.cjs');
            const url = await publishGitHubRelease({ github, context, manifest, bytes });
            core.notice(`GitHub release: ${url}`);
